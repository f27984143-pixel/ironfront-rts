<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0055ff">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ironfront RTS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; user-select: none; }
canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; width: 100vw; height: 100vh; }
#ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-sizing: border-box; z-index: 10; }
.hud-panel { background: rgba(0,0,0,0.8); color: white; padding: 12px; border-radius: 8px; font-family: sans-serif; pointer-events: auto; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px); }
#ui-layer{padding:6px!important}
.hud-panel{background:rgba(0,0,0,.42)!important;padding:5px 8px!important;backdrop-filter:none!important}
.hud-panel h1{font-size:11px!important;margin:0}
.hud-panel p{display:none!important}
.hud-panel button{padding:5px 9px!important;font-size:11px!important}
.w-56,.sm\:w-64{width:140px!important}
#btn-rot-l,#btn-rot-r{width:34px!important;height:34px!important;padding:0!important;font-size:15px!important;opacity:.55}
body.fp #unit-info,body.fp #btn-select-all,body.fp #btn-rot-l,body.fp #btn-rot-r{display:none!important}
body.fp #fire{bottom:60px!important}
body.fp #stick{bottom:40px!important}
#weapon-bar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 25; display: none; gap: 4px; padding: 4px 6px; background: rgba(0,0,0,.6); border-radius: 8px; border: 1px solid rgba(255,255,255,.15); font-family: sans-serif; align-items: center; }
#weapon-bar button { min-width: 38px; background:#222; color:#fff; border:1px solid #555; border-radius:5px; padding:3px 5px; font-size:10px; font-weight:700; cursor:pointer; transition: all .1s; }
#weapon-bar button:hover { background:#333; }
#weapon-bar button.active { background:#f59e0b; color:#000; border-color:#f59e0b; box-shadow:0 0 6px #f59e0b88; }
#weapon-bar button.overheated { background:#dc2626; color:#fff; border-color:#dc2626; animation: wp-pulse .4s infinite alternate; }
@keyframes wp-pulse { from { opacity: .65; } to { opacity: 1; } }
#ammo-display { color:#fff; font-size:11px; font-weight:700; margin-left:6px; min-width:70px; text-align:center; text-shadow:0 0 4px #000; }
</style>
</head>
<body>
<div id="ui-layer">
  <div class="flex justify-between items-start">
    <div class="hud-panel">
      <h1 class="text-lg font-bold text-green-400 uppercase tracking-wider">Comando Táctico RTS</h1>
      <p class="text-xs text-gray-300 mt-1">Gira cámara: <span class="text-white font-bold">Q/E o Botones</span></p>
      <p class="text-xs text-gray-300">Panorámica: <span class="text-white font-bold">Arrastrar / WASD</span></p>
      <p class="text-xs text-gray-300">Órdenes: <span class="text-yellow-400 font-bold">Clic derecho/izquierdo en el terreno</span></p>
    </div>
    <div class="hud-panel w-56 sm:w-64">
      <div class="flex justify-between mb-1">
        <span class="text-xs font-semibold text-blue-300">Zona Victoria</span>
        <span id="capture-text" class="text-xs font-bold text-white">0%</span>
      </div>
      <div class="w-full bg-gray-700 rounded-full h-3">
        <div id="capture-bar" class="bg-blue-500 h-3 rounded-full transition-all duration-200" style="width: 0%"></div>
      </div>
    </div>
  </div>
  <div class="flex flex-col md:flex-row justify-between items-end mb-2 relative">
    <div class="flex gap-2 pointer-events-auto">
      <button id="btn-rot-l" class="bg-gray-800 border border-gray-600 hover:bg-gray-700 text-white p-3 rounded-full shadow-lg font-bold w-12 h-12 flex items-center justify-center text-xl">↺</button>
      <button id="btn-rot-r" class="bg-gray-800 border border-gray-600 hover:bg-gray-700 text-white p-3 rounded-full shadow-lg font-bold w-12 h-12 flex items-center justify-center text-xl">↻</button>
    </div>
    <div class="hud-panel flex flex-col items-center gap-3 mt-4 md:mt-0">
      <div id="unit-info" class="text-xs text-gray-300 w-full text-center">
        <span class="font-bold text-white">Selección:</span>
        <span id="selected-count" class="text-yellow-400">Ninguna</span>
      </div>
      <div class="flex gap-2">
        <button id="btn-select-all" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-4 rounded border border-blue-400 shadow-md transition-colors"> Todas </button>
        <button id="btn-direct-control" class="hidden bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold py-2 px-4 rounded border border-purple-400 shadow-md transition-colors"> Control Directo (C) </button>
        <button id="btn-airstrike" class="bg-red-600 hover:bg-red-500 text-white text-xs font-bold py-2 px-4 rounded border border-red-400 shadow-md transition-colors"> Ataque Aéreo </button>
      </div>
    </div>
  </div>
</div>
<div id="weapon-bar" style="display:none;">
  <button class="wp-btn" data-w="0">1 P</button>
  <button class="wp-btn" data-w="1">2 R</button>
  <button class="wp-btn" data-w="2">3 MG</button>
  <button class="wp-btn" data-w="3">4 S</button>
  <button class="wp-btn" data-w="4">5 BZ</button>
  <span id="ammo-display">--/--</span>
</div>
<div id="msg" style="position:fixed;top:14%;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none;opacity:0;transition:opacity .4s;color:#fff;font:bold 18px sans-serif;text-shadow:0 0 5px #000,0 0 3px #000;background:#0006;padding:4px 12px;border-radius:10px"></div>
<div id="touch" style="display:none;position:fixed;inset:0;z-index:20;pointer-events:none">
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font:bold 26px sans-serif;text-shadow:0 0 3px #000">+</div>
  <div id="stick" style="position:absolute;left:24px;bottom:90px;width:120px;height:120px;border:2px solid #fff4;border-radius:50%;background:#0005;pointer-events:auto;touch-action:none">
    <div id="knob" style="position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#fff6"></div>
  </div>
  <button id="fire" style="position:absolute;right:24px;bottom:100px;width:92px;height:92px;border-radius:50%;border:2px solid #f7b0a7;background:#b3261ecc;color:#fff;font-weight:900;pointer-events:auto;touch-action:none">FUEGO</button>
  <div style="position:absolute;left:50%;top:70px;transform:translateX(-50%);font:11px sans-serif;color:#fff;background:#0007;padding:5px 10px;border-radius:8px">Arrastra la pantalla para mirar</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>

<!-- Controles táctiles (debe ir DESPUÉS de game.js para acceder a joy, fireDirect, etc.) -->
<script>
(function(){
  const st=document.getElementById('stick'),kn=document.getElementById('knob');
  let on=false,cx=0,cy=0;
  function up(e){
    const dx=e.clientX-cx,dy=e.clientY-cy,l=Math.min(48,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
    kn.style.transform='translate('+Math.cos(a)*l+'px,'+Math.sin(a)*l+'px)';
    joy.x=Math.max(-1,Math.min(1,dx/48));
    joy.y=Math.max(-1,Math.min(1,dy/48));
  }
  function rel(){on=false;joy.x=joy.y=0;kn.style.transform='';}
  st.addEventListener('pointerdown',e=>{on=true;st.setPointerCapture(e.pointerId);const r=st.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;up(e);e.preventDefault();});
  st.addEventListener('pointermove',e=>{if(on)up(e);});
  st.addEventListener('pointerup',rel);
  st.addEventListener('pointercancel',rel);
  const fb=document.getElementById('fire');
  fb.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    try{ fb.setPointerCapture(e.pointerId); }catch(_){}
    window.__firing=true;
    if(directControlActive&&directControlUnit&&directControlUnit.cooldown<=0) fireDirect();
  });
  fb.addEventListener('pointerup',e=>{window.__firing=false;try{fb.releasePointerCapture(e.pointerId);}catch(_){}});
  fb.addEventListener('pointercancel',()=>{window.__firing=false;});
})();
</script>
</body>
</html>
